name: Build Firmware

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install ARM GCC toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi libnewlib-arm-none-eabi make
          arm-none-eabi-gcc --version

      - name: Build firmware
        run: |
          make clean
          make -j

      - name: Record firmware size summary
        run: |
          {
            echo "### C3M1 Firmware Build Size"
            echo '```text'
            arm-none-eabi-size build/c3m1_camera.elf
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: c3m1-firmware-${{ github.sha }}
          path: |
            build/c3m1_camera.hex
            build/c3m1_camera.bin
            build/c3m1_camera.elf
            build/c3m1_camera.map
          retention-days: 14
